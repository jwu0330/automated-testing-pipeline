services:
  # ─────────────────────────────────────
  # SSL/TLS 檢測
  # ─────────────────────────────────────
  testssl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testssl-runner
    volumes:
      - ./tests/ssl:/workspace/tests
      - ${REPORTS_RAW_DIR:-./reports}:/workspace/reports
    env_file:
      - .env
    environment:
      # 讓 run-project.sh export 的 shell 變數覆寫 .env 預設值
      - TARGET_URL=${TARGET_URL:?TARGET_URL 必填，請由 tests/scripts/run-project.sh 或 .env 提供}
    entrypoint: ["/bin/bash", "/workspace/tests/run-testssl.sh"]
    profiles:
      - ssl
      - all

  # ─────────────────────────────────────
  # 資安掃描 (OWASP ZAP) — 包成 wrapper script，
  # ─────────────────────────────────────
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap-scanner
    volumes:
      - ./tests/security:/zap-scripts:ro
      - ${REPORTS_RAW_DIR:-./reports}:/zap/wrk
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:?TARGET_URL 必填，請由 tests/scripts/run-project.sh 或 .env 提供}
    entrypoint: ["/bin/sh", "/zap-scripts/run-zap.sh"]
    profiles:
      - security
      - all

  # ─────────────────────────────────────
  # 壓力測試 (k6) — journey-based
  # JOURNEYS_JSON 由 run-project.sh 從 testing.yml 抽出後 export 進來
  # ─────────────────────────────────────
  k6:
    image: grafana/k6:latest
    container_name: k6-runner
    volumes:
      - ./tests/stress:/scripts
      - ${REPORTS_RAW_DIR:-./reports}:/reports
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:?TARGET_URL 必填，請由 tests/scripts/run-project.sh 或 .env 提供}
      - K6_VUS=${K6_VUS:-10}
      - K6_DURATION=${K6_DURATION:-30s}
      - JOURNEYS_JSON=${JOURNEYS_JSON:-}
    command: >
      run /scripts/load-test.js
        --out json=/reports/k6-results.json
        --summary-export=/reports/k6-summary.json
    profiles:
      - stress
      - all

  # ─────────────────────────────────────
  # 深層資安掃描 (Nuclei) — 補 ZAP baseline
  # ─────────────────────────────────────
  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: nuclei-scanner
    volumes:
      - ./tests/nuclei:/scripts:ro
      - ${REPORTS_RAW_DIR:-./reports}:/reports
      # 持久化模板：第一次跑會自動下載，後續沿用，避免每次都得抓
      - nuclei-templates:/root/nuclei-templates
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:?TARGET_URL 必填，請由 tests/scripts/run-project.sh 或 .env 提供}
      - NUCLEI_SEVERITY=${NUCLEI_SEVERITY:-critical,high,medium}
      - NUCLEI_RATE_LIMIT=${NUCLEI_RATE_LIMIT:-50}
    entrypoint: ["/bin/sh", "/scripts/run-nuclei.sh"]
    profiles:
      - nuclei
      - all

  # ─────────────────────────────────────
  # 前端品質 (Lighthouse) — 效能 / A11y / 最佳實踐 / SEO
  # 舊 LIGHTHOUSE_PAGES（空白分隔字串）保留，run-project.sh 會擇一給
  # ─────────────────────────────────────
  lighthouse:
    build:
      context: ./tests/lighthouse
      dockerfile: Dockerfile
    container_name: lighthouse-runner
    volumes:
      - ./tests/lighthouse:/work
      - ${REPORTS_RAW_DIR:-./reports}:/reports
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:?TARGET_URL 必填，請由 tests/scripts/run-project.sh 或 .env 提供}
      - LIGHTHOUSE_PAGES=${LIGHTHOUSE_PAGES:-/}
      - LIGHTHOUSE_PAGES_JSON=${LIGHTHOUSE_PAGES_JSON:-}
      - LIGHTHOUSE_PRESET=${LIGHTHOUSE_PRESET:-desktop}
    entrypoint: ["/bin/bash", "/work/lighthouse-run.sh"]
    profiles:
      - lighthouse
      - all

  # ─────────────────────────────────────
  # 連結檢查 (Lychee) — 壞連結 / 圖片 404
  # ─────────────────────────────────────
  lychee:
    image: lycheeverse/lychee:latest
    container_name: lychee-runner
    volumes:
      - ./tests/links:/scripts:ro
      - ${REPORTS_RAW_DIR:-./reports}:/reports
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:?TARGET_URL 必填，請由 tests/scripts/run-project.sh 或 .env 提供}
      - LYCHEE_MAX_CONCURRENCY=${LYCHEE_MAX_CONCURRENCY:-4}
      - LYCHEE_TIMEOUT=${LYCHEE_TIMEOUT:-15}
    entrypoint: ["/bin/sh", "/scripts/run-lychee.sh"]
    profiles:
      - links
      - all

  # ─────────────────────────────────────
  # E2E 測試 (Playwright) — 通用骨架
  # 註：專案客製的 E2E 由 tests/scripts/run-project.sh 直接 docker run 執行，
  #     本 service 僅用於流水線骨架本身的驗證。
  # ─────────────────────────────────────
  # (API 測試用 docker run，見 run-project.sh run_api_test())
  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-noble
    container_name: playwright-runner
    volumes:
      - ./tests/e2e:/workspace
      - ${REPORTS_RAW_DIR:-./reports}:/reports
    env_file:
      - .env
    working_dir: /workspace
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    profiles:
      - e2e
      - all

volumes:
  nuclei-templates:
