services:
  # ─────────────────────────────────────
  # SSL/TLS 檢測
  # ─────────────────────────────────────
  testssl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testssl-runner
    volumes:
      - ./tests/ssl:/workspace/tests
      - ./reports:/workspace/reports
    env_file:
      - .env
    environment:
      # 讓 run-project.sh export 的 shell 變數覆寫 .env 預設值
      - TARGET_URL=${TARGET_URL:-https://xcity.babydodofun.com}
    entrypoint: ["/bin/bash", "/workspace/tests/run-testssl.sh"]
    profiles:
      - ssl
      - all

  # ─────────────────────────────────────
  # 資安掃描 (OWASP ZAP)
  # ─────────────────────────────────────
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: zap-scanner
    volumes:
      - ./reports:/zap/wrk
    env_file:
      - .env
    command: >
      zap-baseline.py
        -t ${TARGET_URL:-https://xcity.babydodofun.com}
        -r zap-report.html
        -J zap-report.json
        -l WARN
    profiles:
      - security
      - all

  # ─────────────────────────────────────
  # 壓力測試 (k6)
  # ─────────────────────────────────────
  k6:
    image: grafana/k6:latest
    container_name: k6-runner
    volumes:
      - ./tests/stress:/scripts
      - ./reports:/reports
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:-https://xcity.babydodofun.com}
      - K6_VUS=${K6_VUS:-10}
      - K6_DURATION=${K6_DURATION:-30s}
    command: >
      run /scripts/load-test.js
        --out json=/reports/k6-results.json
        --summary-export=/reports/k6-summary.json
    profiles:
      - stress
      - all

  # ─────────────────────────────────────
  # 深層資安掃描 (Nuclei) — 補 ZAP baseline
  # 模板化弱點掃描（CVE / 錯誤配置 / 洩漏端點）
  # ─────────────────────────────────────
  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: nuclei-scanner
    volumes:
      - ./reports:/reports
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:-https://xcity.babydodofun.com}
      - NUCLEI_SEVERITY=${NUCLEI_SEVERITY:-critical,high,medium}
      - NUCLEI_RATE_LIMIT=${NUCLEI_RATE_LIMIT:-50}
    # 用 sh 包起來避免 compose 在命令插值時吃掉空字串；同時把 jsonl 輸出到已知路徑
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >-
        nuclei
        -target "$$TARGET_URL"
        -jsonl-export /reports/nuclei.jsonl
        -severity "$$NUCLEI_SEVERITY"
        -rate-limit "$$NUCLEI_RATE_LIMIT"
        -stats-interval 10
        -no-color
        -disable-update-check
        -silent
        || echo "nuclei exit $$?"
    profiles:
      - nuclei
      - all

  # ─────────────────────────────────────
  # 前端品質 (Lighthouse) — 效能 / A11y / 最佳實踐 / SEO
  # ─────────────────────────────────────
  lighthouse:
    build:
      context: ./tests/lighthouse
      dockerfile: Dockerfile
    container_name: lighthouse-runner
    volumes:
      - ./tests/lighthouse:/work
      - ./reports:/reports
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:-https://xcity.babydodofun.com}
      - LIGHTHOUSE_PAGES=${LIGHTHOUSE_PAGES:-/}
      - LIGHTHOUSE_PRESET=${LIGHTHOUSE_PRESET:-desktop}
    entrypoint: ["/bin/bash", "/work/lighthouse-run.sh"]
    profiles:
      - lighthouse
      - all

  # ─────────────────────────────────────
  # 連結檢查 (Lychee) — 壞連結 / 圖片 404
  # ─────────────────────────────────────
  lychee:
    image: lycheeverse/lychee:latest
    container_name: lychee-runner
    volumes:
      - ./reports:/reports
    env_file:
      - .env
    environment:
      - TARGET_URL=${TARGET_URL:-https://xcity.babydodofun.com}
      - LYCHEE_MAX_CONCURRENCY=${LYCHEE_MAX_CONCURRENCY:-4}
      - LYCHEE_TIMEOUT=${LYCHEE_TIMEOUT:-15}
    command:
      - --format
      - json
      - --output
      - /reports/lychee.json
      - --no-progress
      - --timeout
      - "${LYCHEE_TIMEOUT:-15}"
      - --max-concurrency
      - "${LYCHEE_MAX_CONCURRENCY:-4}"
      - "${TARGET_URL:-https://xcity.babydodofun.com}"
    profiles:
      - links
      - all

  # ─────────────────────────────────────
  # 測試 DB（可選）— PHPUnit 整合測試用
  # 只在 run-project.sh 偵測到 .testing/unit/fixtures/*.sql 時啟動
  # 特性：
  #   - tmpfs：資料寫 RAM，每次啟動都是乾淨狀態
  #   - atp-test-net：phpunit 容器靠這個網路連進來
  #   - root 密碼寫死 test：反正每次跑完就丟
  # ─────────────────────────────────────
  test-mysql:
    image: mysql:8.0
    container_name: test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: test
    tmpfs:
      - /var/lib/mysql
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-ptest", "--silent"]
      interval: 2s
      timeout: 3s
      retries: 20
    profiles:
      - unit-db

  # ─────────────────────────────────────
  # E2E 測試 (Playwright) — 通用骨架
  # 註：專案客製的 E2E 由 scripts/run-project.sh 直接 docker run 執行，
  #     本 service 僅用於流水線骨架本身的驗證。
  # ─────────────────────────────────────
  playwright:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    container_name: playwright-runner
    volumes:
      - ./tests/e2e:/workspace
      - ./reports:/reports
    env_file:
      - .env
    working_dir: /workspace
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]
    profiles:
      - e2e
      - all

  # ─────────────────────────────────────
  # 工作流程編排 (n8n) — 測試總管理者
  # 啟動：docker compose --profile n8n up -d
  # 訪問：http://localhost:${N8N_PORT:-5678}
  # ─────────────────────────────────────
  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    container_name: n8n
    restart: unless-stopped
    # 讓 node user 取得宿主機 docker socket 的 GID（避免 permission denied）
    group_add:
      - "989"
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change-me}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=Asia/Taipei
      - TZ=Asia/Taipei
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      # n8n v2 breaking change：預設停用 executeCommand 與 localFileTrigger；
      # 我們需要 executeCommand 來呼叫 run-project.sh，設空陣列解鎖
      - NODES_EXCLUDE=[]
    volumes:
      - n8n_data:/home/node/.n8n
      # Docker-outside-of-Docker：workflow 可執行 docker compose
      - /var/run/docker.sock:/var/run/docker.sock
      # 掛整個 /mnt/e（或你所有客戶專案的根目錄），讓 n8n 能存取所有註冊的專案
      # 容器內路徑 = 宿主路徑，避免 DooD 掛載錯誤
      - /mnt/e:/mnt/e
    working_dir: ${PIPELINE_ROOT:-/mnt/e/Code/github/automated-testing-pipeline}
    profiles:
      - n8n
      - orchestrator
      - all

volumes:
  # 不指定 name，讓 compose 沿用預設命名 `<project>_n8n_data`
  # 即 `automated-testing-pipeline_n8n_data`，與既有 volume 匹配
  n8n_data:

networks:
  # test-net 給 test-mysql 與 phpunit 連線用。
  # 顯式命名 atp-test-net，避免 compose 預設名稱隨目錄變動導致 docker run --network 找不到
  test-net:
    name: atp-test-net
