# ════════════════════════════════════════════════════════════════
#  testing.yml  —  專案測試設定（4 個必填欄位）
#
#  【只能這麼做 / 固定流程】
#    1. 這個檔必須叫 testing.yml，必須放在 <your-project>/.testing/ 裡
#    2. 下面 4 個欄位是必填，不能省、不能改名
#    3. 其他欄位都叫「選填覆寫」，沒寫就走 pipeline 預設
#
#  Schema：v2
# ════════════════════════════════════════════════════════════════
schema_version: 2

# ─── 必要（4 個欄位，只能這麼寫）─────────────────────────
project:
  name: example_project                   # ① 專案識別名稱（英數底線）
  target_url: https://example.com         # ② 線上測試目標 URL
  local_path: /absolute/path/to/project   # ③ 本地原始碼絕對路徑（留 "" → 只跑網路測試）
  php_version: "8.1"                      # ④ PHP 版本（非 PHP 專案留預設即可）

# ─── 可選：指定共用 pipeline 位置 ────────────────────────
#   若 PIPELINE_HOME 環境變數未設，link.sh 會讀這裡
# pipeline:
#   home: /mnt/e/Code/github/automated-testing-pipeline

# ─── 可選：測試身分（給 api-test / auth-test）────────────
#
#   只是「文件提示」──實際帳密一律寫在 .testing/.env（不進 git）。
#   支援最多 6 組：ADMIN + USER1..USER5，每組獨立跑一輪完整 collection。
#
#   .env 範本：
#     ADMIN_USERNAME=admin001            # 管理者（寫死預設）
#     ADMIN_PASSWORD=@admin001
#     USER1_USERNAME=                    # 選填；留空 → 該輪整輪 skip
#     USER1_PASSWORD=
#     USER1_LABEL=line_signup            # 選填；顯示在報告檔名
#     USER2_USERNAME= ...                # 再加就填 USER2_ / USER3_ ...
#
#   用法：給 3 組帳密就會跑 3 輪、給 5 組就跑 5 輪。
#   報告檔名：newman-junit-admin.xml / newman-junit-user1-line_signup.xml ...

# ─── 可選：覆寫測試開關／參數 ────────────────────────────
#   沒寫 → 走自動偵測（見 README 的「自動偵測規則」）
#
# tests:
#   stress:
#     vus: 20                             # 預設 10
#     duration: 60s                       # 預設 30s
#     pages: [/, /login.html]             # 預設 [/]
#   static:
#     level: 7                            # 預設 5
#   e2e:
#     auth:
#       enabled: true
#       username_env: E2E_USERNAME        # 值放 .testing/.env
#       password_env: E2E_PASSWORD
#     multi_browser: false                # 若要 firefox/webkit，改為 true（配合 playwright.config.ts）
#
#   # ─── A3 API 驗證 ───
#   api-test:
#     # 偵測順序：① .testing/api/collections/*.postman_collection.json
#     #          → ② tests.api-test.openapi（下方 openapi 欄位）
#     #          → ③ .testing/api/openapi.{yaml,yml,json}
#     #          三者都沒有 → 安靜跳過（不報錯，適合無 API 的純前端站）
#     openapi: api/openapi.yaml           # 路徑可絕對 or 相對 local_path
#     enabled: true                       # 偵測到後自動啟用；明確 false 可強制關閉
#
#   # ─── v0.3 新增的 5 個通用測試 ───
#   nuclei:
#     severity: "critical,high,medium"    # 預設；加 low/info 會變慢
#     rate_limit: 50                      # req/s，共享主機建議 ≤ 50
#   lighthouse:
#     preset: desktop                     # desktop | mobile
#     pages: [/, /login.html]             # 預設 [/]
#   monkey:
#     pages: [/, /login.html]             # 預設 [/]
#     attacks: 500                        # 總攻擊次數
#     delay_ms: 10                        # 總耗時 ≈ attacks * delay_ms
#   trivy:
#     severity: "CRITICAL,HIGH,MEDIUM"    # 注意大寫
#     scanners: "vuln,secret,misconfig"
#   links:
#     timeout: 15                         # 單一連結秒數
#     max_concurrency: 4
