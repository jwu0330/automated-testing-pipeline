# ════════════════════════════════════════════════════════════════
# testing.yml — 專案測試設定
#
# 用法：cp 此檔 → <your-project>/.testing/testing.yml → 改 4 個必填欄位
# 規範：docs/project-convention.md
# Schema：v2
# ════════════════════════════════════════════════════════════════
schema_version: 2

# ─── 必填 4 欄位（僅此 4 個不能省）────────────────────────────
project:
  name: example_project                  # ① 專案識別名稱（英數底線，用於 reports/<name>/）
  target_url: https://example.com        # ② 線上測試目標 URL（SSL/ZAP/k6/E2E 用）
  local_path: /absolute/path/to/project  # ③ 本地原始碼路徑（留空或設為 ""  → 只跑網路測試，不跑 static/trivy）
  php_version: "8.1"                     # ④ PHP 版本（保留欄位以利未來工具切版；非 PHP 專案留此預設即可）

# ─── 以下皆選填；沒寫就用智慧預設 ─────────────────────────────
#
# 自動偵測規則：
#   - tests.ssl.enabled        : target_url 是 https:// 開頭 → 自動開
#   - tests.static.enabled     : 有 local_path 且掃描到 .php 檔 → 自動開（level 5）
#   - tests.security.enabled   : 一律開
#   - tests.stress.enabled     : 一律開（vus=10, duration=30s, pages=[/]）
#   - tests.e2e.enabled        : .testing/e2e/package.json 存在 → 自動開
#   - tests.api-test.enabled   : 任一條件成立 → 自動開
#                                ① .testing/api/collections/*.postman_collection.json 存在
#                                ② tests.api-test.openapi 指向有效 OpenAPI 檔
#                                ③ .testing/api/openapi.{yaml,yml,json} 存在
#                                三者都無 → 安靜跳過（不視為錯誤）
#   - tests.nuclei.enabled     : 一律開（severity=critical,high,medium, rate_limit=50）
#   - tests.lighthouse.enabled : 一律開（preset=desktop, pages=[/]）
#   - tests.monkey.enabled     : 一律開（pages=[/], attacks=500, delay_ms=10）
#   - tests.trivy.enabled      : 有 local_path → 自動開（severity=CRITICAL,HIGH,MEDIUM）
#   - tests.links.enabled      : 一律開（max_depth=1, timeout=15）
#
# 想**覆寫**預設時才填下面；想停用某項寫 `enabled: false`。
# ────────────────────────────────────────────────────────────

# 預設值：OpenAPI 路徑寫死為 local/doc/openapi.yaml；不在這位置才改
tests:
  api-test:
    openapi: local/doc/openapi.yaml

# ─── 2026-04-30 起：認證流程預設停用 ───────────────────────────
# 想恢復登入流程的舊行為（極少數情況）：在 .testing/.env 設 LOGIN_REQUIRED=true，
# 完整背景見 docs/auth-coverage-plan.md（保留為歷史紀錄）。
# ────────────────────────────────────────────────────────────

# ─── E2E 全頁巡檢（crawl）— 確認每個分頁都走得到 ──────────────
# 從 target_url 出發 BFS 走訪所有同源 <a href> 連結；驗每頁回 < 400、
# 不被踢回登入頁、無 JS 錯誤。對「auth 已關」的站，這就是「真的測到裡面」
# 的核心訊號。
#
# tests:
#   e2e:
#     crawl:
#       enabled: true                    # 預設 true；改 false 跳過
#       max_depth: 2                     # BFS 深度上限
#       max_pages: 50                    # 總頁數上限（保險閥；爬到上限就停）
#       include_subdomains: false        # true 時 *.host 也算同源
#       ignore_patterns:                 # path regex，符合就跳過
#         - '^/logout'
#         - '\.pdf$'                     # 用 single-quote 避免 YAML 對 \ 雙重轉義
#         - '^/api/'                     # 純 API endpoint 通常不適合用瀏覽器導
#
# tests:
#   stress:
#     vus: 20
#     duration: 60s
#     # 兩種寫法擇一：
#     # ① pages（簡單）：每個 path 一個 GET，全部丟進匿名 journey
#     pages: [/, /login, /admin]
#     # ② journeys（進階）：自己排步驟、weight 分流量比重
#     # journeys:
#     #   - name: anon_browse
#     #     weight: 100
#     #     auth: false                  # cookie 一律不帶（auth 已停用）
#     #     steps:
#     #       - GET /
#     #       - GET /admin
#     #       - "POST /api/foo {\"x\":1}"
#
#   lighthouse:
#     preset: desktop                    # desktop | mobile
#     # 字串陣列即可；物件 {path, auth} 也接受但 auth 已停用、永遠當 false
#     pages: [/, /products, /admin/dashboard]
#
#   nuclei:
#     severity: "critical,high,medium"
#     rate_limit: 50                     # req/s，共享主機建議 ≤ 50
#
#   monkey:
#     pages: [/, /admin]                 # 預設 [/]
#     attacks: 500
#     delay_ms: 10                       # 總耗時 ≈ attacks * delay_ms
#
#   static:
#     level: 7                           # 預設 5，要更嚴就填
#     paths_to_scan: [public, includes]
#
#   api-test:
#     openapi: api/openapi.yaml
#
#   trivy:
#     severity: "CRITICAL,HIGH,MEDIUM"
#     scanners: "vuln,secret,misconfig"
#
#   links:
#     max_depth: 1
#     timeout: 15
#     max_concurrency: 4
